[settings]
api_url = https://wakapi.mishracloud.com/api
debug = false
guess_language = True
exclude =
    ^COMMIT_EDITMSG$
    ^TAG_EDITMSG$
    ^/var/(?!www/).*
    ^/etc/
    ^Copilot .*

#api_key = 9e7
api_key = 9e7f6f62-c2d9-479f-aec8-e032593c0fbe
[projectmap]
^/home/[^/]+/work/([^/]+)/ = {0}

[git_submodule_projectmap]
^/home/[^/]+/work/([^/]+)/([^/]+)/([^/]+)/([^/]+)/ = {0}-{1}-{2}-{3}
^/home/[^/]+/work/([^/]+)/([^/]+)/([^/]+)/ = {0}-{1}-{2}
^/home/[^/]+/work/([^/]+)/([^/]+)/ = {0}-{1}
